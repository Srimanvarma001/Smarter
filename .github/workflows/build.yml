name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test (core + rendered screens) and build debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: smarter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
